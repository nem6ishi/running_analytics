name: Sync Garmin Activities & Update Dashboard

on:
  schedule:
    # 毎日 日本時間 21:00 (UTC 12:00) に自動同期
    - cron: '0 12 * * *'
  workflow_dispatch: # GitHubのWeb画面から手動実行可能

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check Garmin Secrets & Sync Data
        env:
          GARMIN_TOKENS_BASE64: ${{ secrets.GARMIN_TOKENS_BASE64 }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          if [ -z "$GARMIN_TOKENS_BASE64" ] && { [ -z "$GARMIN_EMAIL" ] || [ -z "$GARMIN_PASSWORD" ]; }; then
            echo "::warning ::Garmin 認証用 Secrets (GARMIN_TOKENS_BASE64 または GARMIN_EMAIL / GARMIN_PASSWORD) が設定されていないため、自動同期をスキップします。"
            echo "GitHub Secrets を設定すると毎日 21:00 の自動同期が有効になります。"
            exit 0
          fi
          uv run python sync.py --push
