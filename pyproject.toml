[project]
name = "running-analytics"
version = "0.1.0"
description = "Garmin のランニングデータを解析・コーチングする個人用ダッシュボード"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fitparse>=1.2.0",
    "garminconnect>=0.3.17",
    "jinja2>=3.1.6",
    "pandas>=3.0.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

