<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Running Analytics & AI Coach</title>
  <!-- Google Fonts: Outfit (headings/body) & JetBrains Mono (metrics) & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Chart.js (v4.4.7 固定) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <!-- Compiled Tailwind CSS & Custom Design System -->
  <style>
{{ app_css | safe }}
  </style>
</head>
<body class="bg-[#080c14] text-slate-100 min-h-screen antialiased selection:bg-lime-400 selection:text-slate-950 relative overflow-x-hidden">

  {% include "partials/header.html" %}

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    {% include "partials/cockpit.html" %}
    {% include "partials/activity.html" %}
    {% include "partials/history.html" %}
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800/80 bg-slate-950 py-8 mt-16 text-center text-xs text-slate-500">
    <p>Running Analytics Dashboard • Powered by Python & Tailwind CSS</p>
    <p class="mt-1">Generated for GitHub Pages</p>
  </footer>

  <!-- Embedded Data & Client Scripts -->
  <script>
    window.RUNNING_DATA = {
      activities: {{ insights_json | safe }},
      chartData: {{ chart_data_json | safe }},
      overview: {{ overview_json | safe }},
      weeklyWorkload: {{ weekly_workload_json | safe }},
      formEvolution: {{ form_evolution_json | safe }},
      calendarHeatmap: {{ calendar_heatmap_json | safe }},
      rollingVolume: {{ rolling_volume_json | safe }},
      monthlyStats: {{ monthly_json | safe }},
      vdotData: {{ vdot_data_json | safe }},
      sub50Progress: {{ sub50_progress_json | safe }},
      sub50Forecast: {{ sub50_forecast_json | safe }},
      hrParams: {{ hr_params_json | safe }},
      trainingLoad: {{ training_load_json | safe }},
      zoneDistribution: {{ zone_distribution_json | safe }},
      gearStats: {{ gear_stats_json | safe }},
    };
  </script>
  <script>
{{ app_js | safe }}
  </script>
</body>
</html>
